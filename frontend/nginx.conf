server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://backend:8010;
        # Answers stream as NDJSON; pass each line through as it arrives
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    location /media/ {
        proxy_pass http://backend:8010;
    }

    location / {
        try_files $uri /index.html;
    }
}
