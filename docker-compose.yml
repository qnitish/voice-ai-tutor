services:
  db:
    image: postgres:16
    container_name: voice-tutor-db
    environment:
      POSTGRES_USER: tutor
      POSTGRES_PASSWORD: tutor
      POSTGRES_DB: voice_tutor
    ports:
      - "127.0.0.1:5440:5432"
    volumes:
      - voice_tutor_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tutor -d voice_tutor"]
      interval: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: voice-tutor-backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://tutor:tutor@db:5432/voice_tutor
      DATA_DIR: /data
    volumes:
      - ./data:/data
      - ./input_audio:/input_audio:ro
    ports:
      - "127.0.0.1:8010:8010"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: voice-tutor-frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  voice_tutor_pg:
